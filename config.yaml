# Obsidian vault path — the folder containing your Trading/ subfolder.
# Override at runtime with the OBSIDIAN_VAULT_PATH environment variable.
# Leave blank here and set the env var instead (vault path differs per machine).
vault_path: ""

watchlist:
  chips:
    - NVDA
    - AMD
    - TSM
    - ASML
    - AVGO
  chip_designers:
    - ARM
    - MRVL
  cloud:
    - MSFT
    - GOOGL
    - AMZN
    - META
  power_infra:
    - VRT
    - CEG
    - ETN
  software:
    - CRM
    - PLTR
  baselines:
    - SPY
    - QQQ
    - SOXX

data:
  yfinance:
    retry_attempts: 3
    retry_delay_seconds: 2
  fred:
    retry_attempts: 3
  edgar:
    retry_attempts: 3

ai:
  analyze_model: deepseek/deepseek-v4-pro
  openrouter_timeout_seconds: 90

briefing:
  move_threshold_pct: 3.0
  volume_threshold: 1.5
  earnings_warning_days: 7
  watching_move_threshold_pct: 1.5
  watching_earnings_days: 14

proposals:
  portfolio_value: 1000
  max_risk_per_trade_pct: 1.0
  max_single_position_pct: 5.0
  max_basket_exposure_pct: 10.0
  max_proposals_per_day: 2
  trigger_proximity_pct: 2.0
  stance: balanced       # balanced | conservative
  # Technical setup detection thresholds — tuned after observing all-no-trade output
  ma_proximity_pct: 4.0   # flag if close is within X% of 20-day MA
  rsi_low: 35             # RSI lower bound (35 = oversold boundary; below = falling knife)
  rsi_high: 70            # RSI upper bound (70 = overbought boundary; above = extended)

exits:
  approaching_stop_pct: 2.0  # alert when current price is within X% above stop

regime:
  mode: warn   # warn | halt | off
  ma_period: 20

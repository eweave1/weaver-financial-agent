[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weaver-financial-agent"
version = "0.1.0"
description = "Personal financial research agent for AI-sector stock trading"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "yfinance>=0.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
wf = "weaver.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["weaver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
